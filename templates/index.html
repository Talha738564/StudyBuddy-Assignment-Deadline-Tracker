<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBuddy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css"></head>
<body>
    <nav class="sidebar">
        <h2 class="brand">StudyBuddy</h2>
        <ul class="nav-links">
            <li data-view="dashboard" class="active">Dashboard</li>
            <li data-view="all-assignments">All Assignments</li>
            <li data-view="statistics">Statistics</li>
        </ul>
        <button id="export-btn" class="secondary-btn">Export Report</button>
    </nav>

    <main id="app-content" class="content">
        <!-- Views injected by JS -->
    </main>

    <button id="fab" class="fab">+</button>

    <!-- Slide-over panel for adding assignments -->
    <div id="slide-over" class="slide-over hidden">
        <div class="slide-over-header">
            <h2>Add Assignment</h2>
            <button id="close-slide-over" class="close-btn">&times;</button>
        </div>
        <form id="add-form" class="slide-over-body">
            <label>Type</label>
            <select id="a_type" required>
                <option value="homework">Homework</option>
                <option value="project">Project</option>
                <option value="exam">Exam Prep</option>
            </select>
            
            <label>Title</label>
            <input type="text" id="title" required>
            
            <label>Subject</label>
            <input type="text" id="subject" required>
            
            <label>Deadline</label>
            <input type="text" id="deadline" placeholder="YYYY-MM-DD" required>
            
            <div class="form-row">
                <div>
                    <label>Priority (1-10)</label>
                    <input type="number" id="priority" value="5" min="1" max="10" required>
                </div>
                <div>
                    <label>Est. Hours</label>
                    <input type="number" id="hours" value="1" min="1" required>
                </div>
            </div>
            
            <label>Progress (%)</label>
            <input type="number" id="progress" value="0" min="0" max="100" required>

            <!-- Dynamic Fields -->
            <div id="dynamic-fields">
                <div class="field-group homework-fields">
                    <label>Submission Type</label>
                    <input type="text" id="submission_type">
                </div>
                <div class="field-group project-fields hidden">
                    <label>Milestones (comma-separated)</label>
                    <input type="text" id="milestones">
                    <label>Team Members (comma-separated)</label>
                    <input type="text" id="team_members">
                </div>
                <div class="field-group exam-fields hidden">
                    <label>Important Topics (comma-separated)</label>
                    <input type="text" id="topics">
                </div>
            </div>

            <div id="form-error" class="error-msg hidden"></div>
            <button type="submit" class="primary-btn">Save Assignment</button>
        </form>
    </div>
    <div id="backdrop" class="backdrop hidden"></div>

    <script src="/static/app.js"></script></body>
</html>
